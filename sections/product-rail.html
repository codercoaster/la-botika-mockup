<!--
  Section: product-rail → sections/product-rail.liquid
  Settings: eyebrow, title, subtitle, collections, on_sale, limit, link, tone.
  In Liquid the cards are rendered server-side by looping the chosen collection and
  {% render 'product-card' %}; here JS fills [data-track] from data/products.js.
-->
<link rel="stylesheet" href="assets/section-product-rail.css">
<script src="assets/section-product-rail.js" defer></script>

<section class="product-rail section section--{{ section.settings.tone }}" data-section="product-rail"
  data-collections="{{ section.settings.collections }}" data-on-sale="{{ section.settings.on_sale }}" data-limit="{{ section.settings.limit }}"
  aria-labelledby="{{ section.id }}-title">
  <div class="container">
    <div class="section-heading" data-reveal>
      <div>
        <p class="eyebrow">{{ section.settings.eyebrow }}</p>
        <h2 id="{{ section.id }}-title">{{ section.settings.title }}</h2>
        <p>{{ section.settings.subtitle }}</p>
      </div>
      <div class="product-rail__controls">
        <a class="link-arrow" href="{{ section.settings.link }}">Ver todo
          <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
        <button class="product-rail__arrow" type="button" data-dir="-1" aria-label="Anteriores" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <button class="product-rail__arrow" type="button" data-dir="1" aria-label="Siguientes">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
    <ul class="product-rail__track" role="list" data-track></ul>
  </div>
</section>
